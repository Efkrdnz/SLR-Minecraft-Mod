tasks.register('auditJarClassCompleteness') {
    group = 'verification'
    description = 'Fails when any compiled class, including nested classes, is absent from the NeoForge release jar.'
    dependsOn 'jar'

    doLast {
        def classesRoot = file("${buildDir}/classes/java/main")
        def releaseJar = file("${buildDir}/libs/${releaseJarName}")
        if (!releaseJar.isFile())
            throw new GradleException("Release jar was not produced: ${releaseJar}")

        def compiledClasses = fileTree(classesRoot) {
            include '**/*.class'
        }.files.collect { classesRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/') } as Set

        def packagedClasses = new LinkedHashSet<String>()
        new java.util.zip.ZipFile(releaseJar).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.directory && entry.name.endsWith('.class'))
                    packagedClasses.add(entry.name)
            }
        }

        def missing = (compiledClasses - packagedClasses).sort()
        def unexpected = (packagedClasses - compiledClasses).sort()
        if (!missing.isEmpty() || !unexpected.isEmpty()) {
            throw new GradleException(
                    "Incomplete release jar.\n" +
                            "Missing compiled classes: ${missing.isEmpty() ? 'none' : missing.join(', ')}\n" +
                            "Unexpected class entries: ${unexpected.isEmpty() ? 'none' : unexpected.join(', ')}"
            )
        }

        logger.lifecycle("Release jar class audit passed: ${compiledClasses.size()} classes packaged, including nested classes.")
    }
}

tasks.named('build') {
    dependsOn 'auditJarClassCompleteness'
}

tasks.register('migrateLegacyLevelStems', JavaExec) {
    group = 'maintenance'
    description = 'Dry-runs or applies the offline removal of retired DKC/Monarch LevelStems from one level.dat.'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('net.solocraft.tools.LegacyLevelStemMigrator')

    doFirst {
        def worldPath = providers.gradleProperty('legacyWorld').orNull
        if (worldPath == null || worldPath.trim().isEmpty()) {
            throw new GradleException(
                    'An explicit world path is required. Use "-PlegacyWorld=C:\\path\\to\\world".'
            )
        }
        def applyText = providers.gradleProperty('applyLegacyStemMigration').orNull
        if (applyText != null && !applyText.equalsIgnoreCase('true') && !applyText.equalsIgnoreCase('false')) {
            throw new GradleException('-PapplyLegacyStemMigration must be exactly true or false.')
        }
        def apply = applyText != null && applyText.equalsIgnoreCase('true')
        setArgs([worldPath, apply ? '--apply' : '--dry-run'])
        logger.lifecycle(apply
                ? 'Legacy LevelStem migration APPLY mode requested.'
                : 'Legacy LevelStem migration dry-run mode; no world files will be changed.')
    }
}
