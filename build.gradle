plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
group = project.mod_group_id
def releaseJarName = "SLR${version}-neoforge-${minecraft_version}.jar"

base {
    archivesName = 'sololeveling'
}

// Minecraft 1.21.1 and NeoForge use Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

neoForge {
    version = project.neo_version
    validateAccessTransformers = true

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            jvmArguments.addAll '-Xms512M', '-Xmx4G', '-XX:ActiveProcessorCount=8'
        }

        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            jvmArguments.addAll '-Xms512M', '-Xmx4G', '-XX:ActiveProcessorCount=8'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        sololeveling {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly 'maven.modrinth:better-combat:2.4.0+1.21.1-neoforge'

    // Optional renderer stack used by the compatibility run configuration.
    // Latest stable 1.21.1 pair verified with an active shader pack. Sodium
    // 0.8 remains metadata-compatible when installed without Iris, but Iris's
    // current 1.21.1 beta targets a different Sodium 0.8 API layout.
    localRuntime 'maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge'
    localRuntime 'maven.modrinth:iris:1.8.12+1.21.1-neoforge'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll(['-Xmaxerrs', '5000', '-Xmaxwarns', '500'])
    // This project generates many anonymous/nested classes. A full javac pass
    // prevents stale incremental output from producing an incomplete release jar.
    options.incremental = false
}

tasks.register('auditProcedureReferences') {
    group = 'verification'
    description = 'Fails the build when a Procedure.execute call points to a missing procedure source or class.'
    dependsOn 'classes'

    doLast {
        def procedureSourceDir = file('src/main/java/net/solocraft/procedures')
        def procedureClassDir = file("${buildDir}/classes/java/main/net/solocraft/procedures")
        def references = [] as Set

        fileTree('src/main/java') {
            include '**/*.java'
        }.each { javaFile ->
            def matcher = javaFile.text =~ /\b([A-Za-z0-9_]+Procedure)\.execute\s*\(/
            matcher.each { match ->
                references << match[1]
            }
        }

        def missingSources = references.findAll {
            !file("${procedureSourceDir}/${it}.java").isFile()
        }.sort()
        def missingClasses = references.findAll {
            !file("${procedureClassDir}/${it}.class").isFile()
        }.sort()

        if (!missingSources.isEmpty() || !missingClasses.isEmpty()) {
            throw new GradleException(
                    "Broken procedure references found.\n" +
                            "Missing source files: ${missingSources.isEmpty() ? 'none' : missingSources.join(', ')}\n" +
                            "Missing compiled classes: ${missingClasses.isEmpty() ? 'none' : missingClasses.join(', ')}"
            )
        }

        logger.lifecycle("Procedure reference audit passed: ${references.size()} references checked.")
    }
}

tasks.register('auditShaderDefinitions') {
    group = 'verification'
    description = 'Checks shader definitions and GLSL sources for cross-platform OpenGL compatibility.'

    doLast {
        def failures = []
        def shaderSourceRoot = file('src/main/resources/assets/sololeveling/shaders')
        def shaderSourceFiles = fileTree(shaderSourceRoot) {
            include '**/*.vsh', '**/*.fsh'
        }
        def shaderSourcePaths = shaderSourceFiles.collect {
            shaderSourceRoot.toPath().relativize(it.toPath())
                    .iterator().collect { component -> component.toString() }.join('/')
        } as Set

        shaderSourceFiles.each { shaderFile ->
            def relativePath = project.relativePath(shaderFile).replace('\\', '/')
            def source = shaderFile.getText('UTF-8').replace('\uFEFF', '')
            def firstSourceLine = source.readLines().find { !it.trim().isEmpty() }?.trim()
            if (firstSourceLine != '#version 150') {
                failures << "${relativePath}: must use '#version 150' for the Minecraft 1.21.1 OpenGL compatibility baseline"
            }

            // Ignore comments when checking syntax so explanatory text cannot
            // trigger a false positive.
            def code = source
                    .replaceAll('(?s)/\\*.*?\\*/', '')
                    .replaceAll('(?m)//.*$', '')

            def smoothstepMatcher = (code =~ /smoothstep\s*\(\s*([-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?)\s*,\s*([-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?)/)
            while (smoothstepMatcher.find()) {
                def edge0 = new BigDecimal(smoothstepMatcher.group(1))
                def edge1 = new BigDecimal(smoothstepMatcher.group(2))
                if (edge0 >= edge1) {
                    def line = code.substring(0, smoothstepMatcher.start()).count('\n') + 1
                    failures << "${relativePath}:${line}: smoothstep edge0 must be lower than edge1; use 1.0 - smoothstep(low, high, value) for an inverse ramp"
                }
            }

            [
                    /layout\s*\(/,
                    /\bimage(?:Load|Store)\s*\(/,
                    /\batomicCounter/,
                    /\bmemoryBarrier/,
                    /\bbuffer\b/
            ].each { unsupportedPattern ->
                if ((code =~ unsupportedPattern).find()) {
                    failures << "${relativePath}: uses GLSL functionality newer than the OpenGL 3.2 / GLSL 150 compatibility target"
                }
            }
        }

        fileTree('src/main/resources/assets/sololeveling/shaders') {
            include '**/*.json'
        }.each { shaderFile ->
            def definition = new groovy.json.JsonSlurper().parse(shaderFile)

            // Every sampler and uniform entry must carry a "name" key. A
            // generated definition once had its "name" keys clobbered, which
            // produced a black main menu because shader loading threw during
            // RegisterShadersEvent and took the whole client render setup down.
            (definition.samplers ?: []).eachWithIndex { sampler, index ->
                if (!(sampler.name instanceof String) || sampler.name.isEmpty()) {
                    failures << "${project.relativePath(shaderFile)}: samplers[${index}] is missing a string \"name\""
                }
            }
            (definition.uniforms ?: []).eachWithIndex { uniform, index ->
                if (!(uniform.name instanceof String) || uniform.name.isEmpty()) {
                    failures << "${project.relativePath(shaderFile)}: uniforms[${index}] is missing a string \"name\""
                }
                if (uniform.count != null && uniform.values != null && uniform.values.size() != uniform.count as int) {
                    failures << "${project.relativePath(shaderFile)}: ${uniform.name} expects ${uniform.count} values but has ${uniform.values.size()}"
                }
            }

            // A declared sampler that the fragment shader never reads is
            // stripped by the GLSL compiler, and Minecraft then logs that it
            // cannot find it. Declaring one the shader does not use is a bug.
            def fragment = definition.fragment
            if (fragment instanceof String && fragment.startsWith('sololeveling:')) {
                def fragmentPath = fragment.substring('sololeveling:'.length())
                def fragmentFile = new File(shaderFile.parentFile, "${fragmentPath}.fsh")
                if (fragmentFile.isFile()) {
                    def fragmentSource = fragmentFile.getText('UTF-8')
                            .replaceAll('(?s)/\\*.*?\\*/', '')
                            .replaceAll('(?m)//.*$', '')
                    (definition.samplers ?: []).each { sampler ->
                        if (sampler.name instanceof String
                                && !(fragmentSource =~ /texture\s*\(\s*${sampler.name}\b/).find()) {
                            failures << "${project.relativePath(shaderFile)}: declares sampler ${sampler.name} that ${fragmentPath}.fsh never samples"
                        }
                    }
                }
            }

            [vertex: 'vsh', fragment: 'fsh'].each { stage, extension ->
                def resource = definition[stage]
                if (resource instanceof String && resource.startsWith('sololeveling:')) {
                    def resourcePath = resource.substring('sololeveling:'.length())
                    def definitionDirectory = shaderSourceRoot.toPath()
                            .relativize(shaderFile.parentFile.toPath())
                            .iterator().collect { component -> component.toString() }.join('/')
                    def expectedPath = "${definitionDirectory}/${resourcePath}.${extension}".toString()
                    if (!shaderSourcePaths.contains(expectedPath)) {
                        failures << "${project.relativePath(shaderFile)}: ${stage} source does not exist with exact casing: ${expectedPath}"
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Invalid shader definitions:\n - " + failures.join('\n - '))
        }

        logger.lifecycle("Shader portability audit passed: ${shaderSourceFiles.size()} GLSL sources checked.")
    }
}

